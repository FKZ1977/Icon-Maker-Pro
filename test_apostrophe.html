<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8>
<link href=https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=block rel=stylesheet>
<style>
body { background: #0A0F1F; color: white; font-family: 'Outfit', sans-serif; font-size: 60px; padding: 40px; }
.test1 {
  display: inline-block;
  width: 0;
  overflow: visible;
  background: linear-gradient(135deg, #FF4BD8, #4BEFFF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.test2 {
  display: inline-block;
  background: linear-gradient(135deg, #FF4BD8, #4BEFFF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.test3 {
  position: absolute;
  background: linear-gradient(135deg, #FF4BD8, #4BEFFF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</head>
<body>
<div>Test 1 (width: 0): [<span class=test1>'</span>]</div>
<div>Test 2 (normal): [<span class=test2>'</span>]</div>
<div style=position:relative>Test 3 (absolute): [<span class=test3>'</span>]</div>
</body>
</html>
